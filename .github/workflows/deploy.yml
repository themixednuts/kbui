name: Deploy Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - name: Check Cloudflare deployment credentials
        id: cloudflare
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          if [[ -n "$CLOUDFLARE_ACCOUNT_ID" && -n "$CLOUDFLARE_API_TOKEN" ]]; then
            printf 'configured=true\n' >> "$GITHUB_OUTPUT"
          else
            printf '::warning::Add CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN repository secrets to enable production deploys.\n'
            printf 'configured=false\n' >> "$GITHUB_OUTPUT"
          fi

      - uses: oven-sh/setup-bun@v2
        if: steps.cloudflare.outputs.configured == 'true'
        with:
          bun-version-file: package.json

      - name: Install dependencies
        if: steps.cloudflare.outputs.configured == 'true'
        run: bun install --frozen-lockfile

      - name: Build Worker
        if: steps.cloudflare.outputs.configured == 'true'
        run: bun run vp build

      - name: Sync Worker runtime secrets
        if: steps.cloudflare.outputs.configured == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL }}
          GITHUB_CLIENT_ID: ${{ secrets.GH_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.GH_CLIENT_SECRET }}
          MONKEYTYPE_SECRET_KEY: ${{ secrets.MONKEYTYPE_SECRET_KEY }}
          GITHUB_APP_SLUG: ${{ secrets.GH_APP_SLUG }}
          GITHUB_APP_ID: ${{ secrets.GH_APP_ID }}
          GITHUB_APP_CLIENT_ID: ${{ secrets.GH_APP_CLIENT_ID }}
          GITHUB_APP_CLIENT_SECRET: ${{ secrets.GH_APP_CLIENT_SECRET }}
          GITHUB_APP_INSTALL_URL: ${{ secrets.GH_APP_INSTALL_URL }}
          GITHUB_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
          GITHUB_WEBHOOK_SECRET: ${{ secrets.GH_WEBHOOK_SECRET }}
          GITHUB_APP_TOKEN_SECRET_KEY: ${{ secrets.GH_APP_TOKEN_SECRET_KEY }}
        shell: bash
        run: |
          node <<'NODE' | bun run wrangler secret bulk
          const names = [
            "BETTER_AUTH_SECRET",
            "BETTER_AUTH_URL",
            "GITHUB_CLIENT_ID",
            "GITHUB_CLIENT_SECRET",
            "MONKEYTYPE_SECRET_KEY",
            "GITHUB_APP_SLUG",
            "GITHUB_APP_ID",
            "GITHUB_APP_CLIENT_ID",
            "GITHUB_APP_CLIENT_SECRET",
            "GITHUB_APP_INSTALL_URL",
            "GITHUB_APP_PRIVATE_KEY",
            "GITHUB_WEBHOOK_SECRET",
            "GITHUB_APP_TOKEN_SECRET_KEY",
          ];
          const missing = names.filter((name) => !process.env[name]);
          if (missing.length > 0) {
            console.error(`Missing required GitHub Actions secrets for: ${missing.join(", ")}`);
            process.exit(1);
          }
          process.stdout.write(
            JSON.stringify(Object.fromEntries(names.map((name) => [name, process.env[name]]))),
          );
          NODE

      - name: Deploy Worker
        if: steps.cloudflare.outputs.configured == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bun run wrangler deploy --keep-vars

name = "keeb-workbench"
main = ".svelte-kit/cloudflare/_worker.js"
account_id = "1e88eae16685f052f69fe11ad7c65abe"
compatibility_date = "2026-05-05"
compatibility_flags = ["nodejs_compat"]

[assets]
binding = "ASSETS"
directory = ".svelte-kit/cloudflare"

[[durable_objects.bindings]]
name = "UserWorkbenchAgent"
class_name = "UserWorkbenchAgent"

[[durable_objects.bindings]]
name = "AuthAgent"
class_name = "AuthAgent"

[[durable_objects.bindings]]
name = "LiveStoreSyncDO"
class_name = "LiveStoreSyncDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["UserWorkbenchAgent"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["AuthAgent"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["LiveStoreSyncDO"]

